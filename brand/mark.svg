<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 24 24" fill="currentColor" role="img" aria-label="Ziga Data">
  <!--
    Z built from spreadsheet rows. 32-unit grid, optically centred on (16,16).
    Bars are 4.0 deep; the diagonal is cut to 3.6 perpendicular (0.90x) so it
    reads as equal weight rather than heavy.

    The bars are paths, not rects, because the two corners where the diagonal
    joins them must be SQUARE — a rounded corner there spikes past the join.
    Every other corner carries rx=1.
      top bar     : square bottom-right  (diagonal leaves here)
      data cell L : square top-left      (diagonal lands here)
  -->
  <!-- glyph:start -->
  <path d="M6 6 H26 A1 1 0 0 1 27 7 V10 H6 A1 1 0 0 1 5 9 V7 A1 1 0 0 1 6 6 Z"/>
  <polygon points="27,10 21,10 5,22 11,22"/>
  <path d="M5 22 H13.5 A1 1 0 0 1 14.5 23 V25 A1 1 0 0 1 13.5 26 H6 A1 1 0 0 1 5 25 V22 Z"/>
  <rect x="17.5" y="22" width="9.5" height="4" rx="1"/>
  <!-- glyph:end -->
</svg>
