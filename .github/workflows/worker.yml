# worker.yml — CI for the Cloudflare Email Worker that captures inbound leads.
#
# Deployed independently of the Go binary: the Worker is outside the go:embed
# tree, so the two ship on their own cadences (deploy.yml ignores worker/**).
#
# The tests here are not optional decoration. test/sign.test.ts pins the same
# HMAC known-answer vector as internal/ingest/hmac_test.go, and test/parse.test.ts
# asserts this Worker reproduces the shared fixture corpus in
# internal/ingest/testdata/corpus. Those are the two places the Worker and the
# Go side can silently drift apart, and drift means every lead stops arriving
# with nothing but 401s to show for it.
name: worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      # The corpus is a cross-language contract, so a fixture change must
      # re-run the Worker's side of it too.
      - 'internal/ingest/testdata/corpus/**'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'internal/ingest/testdata/corpus/**'
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: worker/email-ingest

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/email-ingest/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    needs: verify
    # Only from main: a PR must not be able to change what routes production
    # mail.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/email-ingest/package-lock.json
      - run: npm ci
      - name: Deploy with wrangler
        # Skipped, not failed, when the token is absent. Email ingestion is
        # optional: a repo that has not set this up must not get a red main
        # for a feature it is not running.
        #
        # NOTE the token here is NOT the one in ziga.env. This one needs
        # Workers Scripts -> Edit to publish the Worker. The app's
        # CLOUDFLARE_API_TOKEN needs Email Routing Rules -> Edit to create
        # per-address rules. Two different scopes, two different homes; see
        # deploy/RUNBOOK.md §k.3.
        #
        # ZIGA_INGEST_SECRET is deliberately not set here either. It is a
        # wrangler secret applied once by hand and survives redeploys, which
        # keeps it out of the actions log and out of this repo's secrets.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_WORKERS_TOKEN is not set — skipping the Worker deploy."
            echo "Email ingestion is optional; see deploy/RUNBOOK.md §k to enable it."
            exit 0
          fi
          npx wrangler deploy
